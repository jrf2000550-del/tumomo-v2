<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TU MOMO Real Estate</title>
    <meta name="description" content="Busca, compara, financia y conecta con profesionales verificados. El ecosistema digital del Real Estate en Bolivia." />
    <meta name="theme-color" content="#151515" />
    <meta property="og:title" content="TU MOMO Real Estate" />
    <meta property="og:description" content="Del portal al ecosistema. Busca, compara, financia y construye en un solo lugar." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restaura la ruta que 404.html guardo antes de redirigir (ver public/404.html).
      // Debe correr antes de que monte React, para que el router lea la URL correcta.
      (function () {
        try {
          var destino = sessionStorage.getItem('momo:redirigir')
          if (destino) {
            sessionStorage.removeItem('momo:redirigir')
            var base = document.baseURI.replace(window.location.origin, '').replace(/\/$/, '')
            history.replaceState(null, '', base + destino)
          }
        } catch (e) { /* sessionStorage bloqueado: se sirve la home */ }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
